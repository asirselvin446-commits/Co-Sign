# Render Blueprint: Co-Sign backend + security console (one Docker web service) and Redis.
# The database is Supabase Postgres (see docs/deploy-render-supabase.md); push uses Firebase.
#
# Secrets never live in this file: Render generates the signing and encryption keys, and values
# marked `sync: false` are entered in the Render Dashboard when the Blueprint is applied.

services:
  - type: web
    name: co-sign-api
    runtime: docker
    plan: free
    region: singapore # closest Render region to the Supabase project in Mumbai
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      # PUBLIC_BASE_URL, RP_ID, WEB_ORIGINS and CORS_ORIGINS default to this service's
      # onrender.com address (RENDER_EXTERNAL_URL). Set them only when using your own domain.
      - key: TRUST_PROXY
        value: '1'
      - key: DISPLAY_TIMEZONE
        value: Asia/Kolkata

      # Supabase session pooler URL for the cosign_app role, ending in
      # ?schema=cosign&sslmode=require&connection_limit=5
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: co-sign-redis
          property: connectionString

      # 256-bit random values generated by Render on first apply (never regenerated).
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: BLIND_INDEX_KEY
        generateValue: true

      - key: ANDROID_PACKAGE
        value: app.cosign.mobile
      # SHA-256 of the key that signs the APK, e.g. AB:CD:...; passkeys fail until it is set.
      - key: ANDROID_SHA256_CERT_FINGERPRINTS
        sync: false
      # base64 of the Firebase service-account JSON; without it guardians are alerted only in-app.
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64
        sync: false

      # Free instances have no shell: log a one-time first-administrator invite until one exists.
      - key: BOOTSTRAP_ADMIN_INVITE
        value: 'true'

  - type: keyvalue
    name: co-sign-redis
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction # rate-limit counters, challenges and sessions must not be evicted
    ipAllowList: [] # internal connections only
