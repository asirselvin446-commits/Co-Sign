<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>SaathiAuth Guardian</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Baloo+Thambi+2:wght@500;700&family=Noto+Sans:wght@400;600&family=Noto+Sans+Tamil:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap">
  <link rel="stylesheet" href="/css/app.css">
  <script src="/vendor/simplewebauthn-browser.js" defer></script>
  <script type="module" src="/js/guardian.js"></script>
</head>
<body class="guardian">
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="/guardian.html"><span class="brand-mark" aria-hidden="true"></span>SaathiAuth <span class="brand-role" data-i18n="gTitle">Guardian</span></a>
    <div class="controls">
      <div id="lang-switch" class="segmented" role="group" aria-label="Language / மொழி / भाषा"></div>
      <button id="voice-toggle" class="chip" type="button" aria-pressed="true">Voice on</button>
    </div>
  </header>

  <main id="main" class="column">
    <div id="message" role="status" aria-live="polite">
      <div class="message-card" hidden>
        <p class="message-what"></p>
        <p class="message-next"></p>
        <button id="hear-again" class="text-button" type="button" data-i18n="hearAgain">Hear again</button>
      </div>
    </div>
    <p id="voice-note" class="voice-note" hidden></p>

    <section id="screen-signin" data-screen hidden aria-labelledby="g-signin-title">
      <h1 id="g-signin-title" class="page-title" data-i18n="gTitle">Guardian</h1>
      <p class="lede" data-i18n="gIntro"></p>
      <button id="g-sign-in" class="button primary large" type="button" data-i18n="gSignIn">Sign in as guardian</button>
    </section>

    <section id="screen-invite" data-screen hidden aria-labelledby="g-invite-title">
      <h1 id="g-invite-title" class="page-title"></h1>
      <p class="lede" data-i18n="gIntro"></p>
      <form id="g-register-form" class="stack panel" novalidate>
        <label for="g-name" data-i18n="yourName">Your name</label>
        <input id="g-name" autocomplete="name" maxlength="40" required>
        <button class="button primary" type="submit" data-i18n="gAccept">Become a guardian</button>
      </form>
      <button id="g-accept-existing" class="button primary" type="button" hidden data-i18n="gAcceptExisting">Accept invite</button>
    </section>

    <section id="screen-home" data-screen hidden aria-labelledby="g-home-title">
      <div class="home-head">
        <h1 id="g-home-title" class="page-title" tabindex="-1"></h1>
        <button id="g-sign-out" class="text-button" type="button" data-i18n="signOut">Sign out</button>
      </div>
      <p id="g-guarding" class="muted"></p>
      <div id="g-requests" class="requests"></div>
      <p id="g-empty" class="muted empty" data-i18n="gNoRequests"></p>
    </section>
  </main>
</body>
</html>
